# FoodDyes: Red 40, Yellow 5 and Blue 1.
# Powders give their dye's effect at level I, sodas at level II.
# Red 40 -> Strength, Yellow 5 -> Saturation, Blue 1 -> Speed.
powder-effect-seconds: 30
drink-effect-seconds: 30
# Eating a powder or drinking a soda costs 1 heart of max health. The hearts come back when you die.
heart-cost-enabled: true
# Most hearts a player can lose to food dyes (9 = down to 1 heart of max health).
max-hearts-lost: 9
